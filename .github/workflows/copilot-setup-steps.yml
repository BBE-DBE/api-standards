# Umgebung, die GitHub Copilot im Coding-Agent-Lauf vorfindet.
# Der Job MUSS "copilot-setup-steps" heissen, sonst wird er ignoriert.
# Doku: https://docs.github.com/copilot/customizing-copilot/customizing-the-development-environment-for-copilot-coding-agent
name: Copilot-Umgebung

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/copilot-setup-steps.yml']
  pull_request:
    paths: ['.github/workflows/copilot-setup-steps.yml']

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Kein `cache: npm` an setup-node: das verlangt eine Sperrdatei und
      # bricht ab, wenn das Repo nur package.json hat. Zwischenspeicher
      # darum getrennt und nur dann, wenn eine Sperrdatei existiert.
      - name: Node einrichten
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: npm-Zwischenspeicher
        if: hashFiles('package-lock.json', 'npm-shrinkwrap.json') != ''
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Abhaengigkeiten installieren
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Python einrichten
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: uv einrichten
        if: hashFiles('pyproject.toml') != ''
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python-Abhaengigkeiten
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        run: |
          if [ -f pyproject.toml ]; then
            uv sync --all-extras || uv pip install --system -e . || true
          else
            python -m pip install --quiet -r requirements.txt
          fi

      # Ein Repo, das eine festgelegte Node- oder Python-Fassung braucht,
      # ergaenzt dafuer einen eigenen Schritt. Diese Datei bleibt die Grundlage.
